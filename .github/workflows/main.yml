name: Bot Always Active
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *' # يعيد تشغيله كل 6 ساعات لضمان النشاط
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Telegram Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python rad.py
