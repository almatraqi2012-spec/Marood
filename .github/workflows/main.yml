name: marood Auto Run

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # 👈 تم التحديث من v3 إلى v4 لدعم Node.js 24

      - name: Set up Python
        uses: actions/setup-python@v5 # 👈 تم التحديث من v4 إلى v5 لدعم Node.js 24
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pyTelegramBotAPI flask requests numpy ccxt pandas supabase

      - name: Run marood Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python tal22_encrypted.py
